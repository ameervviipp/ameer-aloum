<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style>html { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyACkoN8JM59JKfFeEJwZqQVkJf0rHWPlZQ",
        authDomain: "ameer-aluom.firebaseapp.com",
        projectId: "ameer-aluom",
        storageBucket: "ameer-aluom.firebasestorage.app",
        messagingSenderId: "532053220562",
        appId: "1:532053220562:web:7e47d6cb878c3d1d6ca10b"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    var currentUid = null;
    firebase.auth().onAuthStateChanged(function(user) {
        if (user) {
            document.documentElement.style.visibility = 'visible';
            currentUid = user.uid;
            loadProfiles();
        } else {
            window.location.replace('login.html');
        }
    });
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة صور البروفيلات</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f3f7; color: #2c3e50; min-height: 100vh; }

    .page-header {
        background: linear-gradient(135deg, #2c3e50, #34495e);
        color: white;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .page-header h1 { font-size: 20px; font-weight: 700; }
    .page-header a {
        margin-right: auto;
        background: rgba(255,255,255,.15);
        color: white;
        padding: 7px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 13px;
        transition: background .2s;
    }
    .page-header a:hover { background: rgba(255,255,255,.28); }

    .search-bar {
        padding: 16px 28px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .search-bar input {
        padding: 9px 14px;
        border: 1px solid #bdc3c7;
        border-radius: 8px;
        font-size: 14px;
        width: 260px;
        outline: none;
    }
    .search-bar input:focus { border-color: #2980b9; box-shadow: 0 0 0 2px rgba(41,128,185,.2); }
    .tab-row {
        display: flex;
        gap: 8px;
    }
    .tab-btn {
        padding: 8px 18px;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #636e72;
        transition: all .2s;
    }
    .tab-btn.active { border-color: #2980b9; background: #2980b9; color: white; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
        padding: 0 28px 32px;
    }

    .prof-card {
        background: white;
        border-radius: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        padding: 18px 14px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: relative;
        transition: box-shadow .2s;
    }
    .prof-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.14); }

    .prof-code {
        background: #2c3e50;
        color: white;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 1px;
    }

    .prof-img-wrap {
        width: 110px;
        height: 80px;
        border: 2px dashed #bdc3c7;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: border-color .2s;
    }
    .prof-img-wrap:hover { border-color: #2980b9; }
    .prof-img-wrap img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
    }
    .prof-img-wrap .no-img {
        font-size: 30px;
        opacity: .3;
    }
    .prof-img-wrap .upload-overlay {
        position: absolute;
        inset: 0;
        background: rgba(41,128,185,.85);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        opacity: 0;
        border-radius: 8px;
        transition: opacity .2s;
    }
    .prof-img-wrap:hover .upload-overlay { opacity: 1; }
    .upload-overlay span { font-size: 22px; }

    .prof-name {
        font-size: 12px;
        color: #636e72;
        text-align: center;
        line-height: 1.4;
    }

    .card-actions {
        display: flex;
        gap: 6px;
        width: 100%;
    }
    .btn-upload {
        flex: 1;
        padding: 7px;
        background: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background .2s;
        position: relative;
        overflow: hidden;
    }
    .btn-upload:hover { background: #1f618d; }
    .btn-upload input[type=file] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
    }
    .btn-delete-img {
        padding: 7px 10px;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background .2s;
    }
    .btn-delete-img:hover { background: #c0392b; }
    .btn-delete-img:disabled { background: #bdc3c7; cursor: default; }

    .status-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #bdc3c7;
    }
    .status-badge.has-img { background: #27ae60; }

    .loading-msg {
        text-align: center;
        padding: 60px 20px;
        color: #95a5a6;
        font-size: 16px;
        grid-column: 1 / -1;
    }
    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: #2c3e50;
        color: white;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 16px rgba(0,0,0,.25);
        transition: transform .3s;
        z-index: 1000;
        pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #27ae60; }
    .toast.error   { background: #c0392b; }

    .stats-bar {
        padding: 10px 28px;
        font-size: 13px;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div class="page-header">
    <span style="font-size:26px;">🖼️</span>
    <h1>إدارة صور البروفيلات</h1>
    <a href="index.html">🏠 الحاسبة</a>
    <a href="projects.html">📋 المشاريع</a>
    <a href="inventory.html">📦 المخزون</a>
    <a href="manage-images.html" style="background:#e67e22; color:white;">🖼️ الصور</a>
    <a href="window-types.html">🏗️ الأنواع</a>
</div>

<div class="search-bar">
    <input type="text" id="search_input" placeholder="🔍  ابحث بالكود أو الاسم..." oninput="filterCards()">
    <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('all',this)">الكل</button>
        <button class="tab-btn" onclick="switchTab('normal',this)">🪟 شباك عادي</button>
        <button class="tab-btn" onclick="switchTab('shutter',this)">📦 أباجور</button>
        <button class="tab-btn" onclick="switchTab('no-img',this)">⚪ بدون صورة</button>
    </div>
</div>

<div class="stats-bar" id="stats_bar">جاري التحميل...</div>

<div class="grid" id="profiles_grid">
    <div class="loading-msg">⏳ جاري تحميل البروفيلات...</div>
</div>

<div class="toast" id="toast_msg"></div>

<script>
var allProfiles = [];
var currentTab  = 'all';
var imgStatusMap = {};

function loadProfiles() {
    db.collection('config').doc(currentUid).get().then(function(doc) {
        var data = doc.exists ? doc.data() : {};
        var normal  = data.normal_items  || getLocalFallback('workshop_data',  'normalItems',  getDefault('normal'));
        var shutter = data.shutter_items || getLocalFallback('workshop_shutter','shutterItems', getDefault('shutter'));

        // دمج وإزالة التكرار بالكود
        var seen = {};
        var combined = [];
        normal.forEach(function(p)  { if (!seen[p.code]) { seen[p.code]=1; combined.push({ code:p.code, name:p.name, type:'normal' }); } });
        shutter.forEach(function(p) { if (!seen[p.code]) { seen[p.code]=1; combined.push({ code:p.code, name:p.name, type:'shutter' }); } else { combined.find(function(c){ return c.code===p.code; }).type='both'; } });

        allProfiles = combined;
        renderGrid(combined);
    }).catch(function() {
        document.getElementById('profiles_grid').innerHTML = '<div class="loading-msg">❌ تعذّر تحميل البروفيلات</div>';
    });
}

function getLocalFallback(key1, key2, def) {
    try { var d = JSON.parse(localStorage.getItem(key1)); if (d && d[key2]) return d[key2]; } catch(e){}
    return def;
}
function getDefault(t) { return []; }

function renderGrid(list) {
    var grid = document.getElementById('profiles_grid');
    if (!list.length) {
        grid.innerHTML = '<div class="loading-msg">لا توجد نتائج</div>';
        updateStats(0, 0);
        return;
    }
    var html = '';
    var withImg = 0;
    list.forEach(function(p, i) {
        var hasImg = imgStatusMap[p.code] !== false;
        if (hasImg) withImg++;
        var typeLabel = p.type === 'shutter' ? '📦' : p.type === 'both' ? '🪟📦' : '🪟';
        html += '<div class="prof-card" id="card_' + p.code + '" data-code="' + p.code + '" data-name="' + p.name + '" data-type="' + p.type + '">' +
            '<div class="status-badge' + (imgStatusMap[p.code] ? ' has-img' : '') + '" id="badge_' + p.code + '"></div>' +
            '<div class="prof-code">' + p.code + '</div>' +
            '<div class="prof-img-wrap" onclick="document.getElementById(\'file_' + p.code + '\').click()">' +
                '<img id="pimg_' + p.code + '" data-profcode="' + p.code + '" alt="" style="display:none;">' +
                '<div class="no-img" id="noimg_' + p.code + '" style="display:none;">🖼️</div>' +
                '<div class="upload-overlay"><span>📷</span>رفع صورة</div>' +
            '</div>' +
            '<div class="prof-name">' + typeLabel + ' ' + p.name + '</div>' +
            '<div class="card-actions">' +
                '<button class="btn-upload">📷 رفع<input type="file" id="file_' + p.code + '" accept="image/*" onchange="uploadImg(\'' + p.code + '\',this)"></button>' +
                '<button class="btn-delete-img" id="del_' + p.code + '" onclick="deleteImg(\'' + p.code + '\')" title="حذف الصورة">🗑️</button>' +
            '</div>' +
        '</div>';
    });
    grid.innerHTML = html;
    updateStats(list.length, withImg);
    loadAllProfileImages();
}

function markHasImg(code, has) {
    imgStatusMap[code] = has;
    var badge = document.getElementById('badge_' + code);
    var noImg = document.getElementById('noimg_' + code);
    var pimg  = document.getElementById('pimg_' + code);
    if (badge) badge.className = 'status-badge' + (has ? ' has-img' : '');
    if (noImg) noImg.style.display = has ? 'none' : 'flex';
    if (pimg && !has) pimg.style.display = 'none';
    filterCards();
}

function updateStats(total, withImg) {
    document.getElementById('stats_bar').textContent =
        'إجمالي البروفيلات: ' + total + '  |  يوجد لها صورة: ' + withImg + '  |  بدون صورة: ' + (total - withImg);
}

function loadAllProfileImages() {
    var user = firebase.auth().currentUser;
    if (!user) return;
    firebase.firestore().collection('config').doc(user.uid).get().then(function(doc) {
        var imgs = (doc.exists && doc.data().profile_images) || {};
        Object.keys(imgs).forEach(function(code) {
            if (!imgs[code]) return;
            document.querySelectorAll('img[data-profcode="' + code + '"]').forEach(function(img) {
                img.src = imgs[code]; img.style.display = '';
            });
            markHasImg(code, true);
        });
        allProfiles.forEach(function(p) {
            if (!imgs[p.code]) markHasImg(p.code, false);
        });
        var withImg = Object.keys(imgs).filter(function(k) { return !!imgs[k]; }).length;
        updateStats(allProfiles.length, withImg);
    }).catch(function(e) { console.warn('loadAllProfileImages:', e); });
}

function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
            var MAX = 400;
            var w = img.width, h = img.height;
            if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
            else        { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            cb(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function uploadImg(code, input) {
    var file = input.files[0];
    if (!file) return;
    var user = firebase.auth().currentUser;
    if (!user) { showToast('❌ يجب تسجيل الدخول أولاً', 'error'); return; }
    compressImage(file, function(dataUrl) {
        var user = firebase.auth().currentUser;
        if (!user) { showToast('❌ يجب تسجيل الدخول أولاً', 'error'); return; }
        var ref = firebase.firestore().collection('config').doc(user.uid);
        var upd = {}; upd['profile_images.' + code] = dataUrl;
        function onSaved() {
            document.querySelectorAll('img[data-profcode="' + code + '"]').forEach(function(img) {
                img.src = dataUrl; img.style.display = '';
            });
            markHasImg(code, true);
            showToast('✅ تم رفع الصورة بنجاح', 'success');
        }
        ref.update(upd).then(onSaved).catch(function(e) {
            if (e && e.code === 'not-found') {
                var init = { profile_images: {} };
                init.profile_images[code] = dataUrl;
                ref.set(init, { merge: true }).then(onSaved)
                   .catch(function(e2) { showToast('❌ ' + (e2 && e2.message ? e2.message : 'تعذر الحفظ'), 'error'); });
            } else { showToast('❌ ' + (e && e.message ? e.message : 'تعذر الحفظ'), 'error'); }
        });
    });
}

function deleteImg(code) {
    if (!confirm('حذف صورة البروفيل ' + code + '؟')) return;
    var user = firebase.auth().currentUser;
    if (!user) { showToast('❌ يجب تسجيل الدخول أولاً', 'error'); return; }
    var upd = {}; upd['profile_images.' + code] = firebase.firestore.FieldValue.delete();
    firebase.firestore().collection('config').doc(user.uid).update(upd)
    .then(function() {
        document.querySelectorAll('img[data-profcode="' + code + '"]').forEach(function(img) {
            img.src = ''; img.style.display = 'none';
        });
        markHasImg(code, false);
        showToast('🗑️ تم حذف الصورة', 'success');
    })
    .catch(function() { showToast('❌ تعذر الحذف', 'error'); });
}

function filterCards() {
    var q    = (document.getElementById('search_input').value || '').toLowerCase();
    var cards = document.querySelectorAll('.prof-card');
    var visible = 0;
    cards.forEach(function(card) {
        var code = card.dataset.code || '';
        var name = card.dataset.name || '';
        var type = card.dataset.type || '';
        var matchSearch = !q || code.toLowerCase().includes(q) || name.toLowerCase().includes(q);
        var matchTab = currentTab === 'all'
            || (currentTab === 'normal'  && (type === 'normal' || type === 'both'))
            || (currentTab === 'shutter' && (type === 'shutter' || type === 'both'))
            || (currentTab === 'no-img'  && imgStatusMap[code] === false);
        var show = matchSearch && matchTab;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
    });
}

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    filterCards();
}

var _toastTimer;
function showToast(msg, type) {
    var t = document.getElementById('toast_msg');
    t.textContent = msg;
    t.className = 'toast ' + (type || '') + ' show';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
</script>
</body>
</html>
