<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ورشة الألمنيوم</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 50%;
            margin-bottom: 16px;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            color: #2dd4bf;
            stroke: #2dd4bf;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-description {
            font-size: 15px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forgot-link {
            font-size: 13px;
            color: #2dd4bf;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #5eead4;
            text-decoration: underline;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 14px;
            color: #f1f5f9;
            direction: ltr;
            text-align: left;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            background-color: #14b8a6;
            color: #020617;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 28px;
            transition: background-color 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .btn-login:hover {
            background-color: #2dd4bf;
        }

        .btn-login:active {
            background-color: #0f9588;
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <h1 class="card-title">ورشة الألمنيوم</h1>
            <p class="card-description">سجل الدخول لإدارة مشاريعك وعملائك</p>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني</label>
            <input class="form-input" type="email" id="email" placeholder="name@example.com">
        </div>

        <div class="form-group">
            <div class="label-row">
                <label class="form-label" for="pass" style="margin-bottom:0">كلمة المرور</label>
                <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>
            <input class="form-input" type="password" id="pass" placeholder="••••••••">
        </div>

        <button class="btn-login" id="loginBtn">دخول</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyACkoN8JM59JKfFeEJwZqQVkJf0rHWPlZQ",
            authDomain: "ameer-aluom.firebaseapp.com",
            projectId: "ameer-aluom",
            storageBucket: "ameer-aluom.firebasestorage.app",
            messagingSenderId: "532053220562",
            appId: "1:532053220562:web:7e47d6cb878c3d1d6ca10b"
        };

        firebase.initializeApp(firebaseConfig);

        document.getElementById("loginBtn").addEventListener("click", function() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .then(function() {
                    return firebase.auth().signInWithEmailAndPassword(email, pass);
                })
                .then(function() {
                    window.location.href = "index.html";
                })
                .catch(function(error) {
                    errorMsg.textContent = "خطأ: تأكد من البريد وكلمة المرور";
                    errorMsg.style.display = "block";
                });
        });

        document.getElementById("pass").addEventListener("keydown", function(e) {
            if (e.key === "Enter") document.getElementById("loginBtn").click();
        });
    </script>
</body>
</html>
