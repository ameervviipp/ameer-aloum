<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button id="loginBtn">دخول</button>

    <script>
        // 2. إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyACkoN8JM59JKfFeEJwZqQVkJf0rHWPlZQ",
            authDomain: "ameer-aluom.firebaseapp.com",
            projectId: "ameer-aluom",
            storageBucket: "ameer-aluom.firebasestorage.app",
            messagingSenderId: "532053220562",
            appId: "1:532053220562:web:7e47d6cb878c3d1d6ca10b"
        };

        // 3. تهيئة التطبيق
        firebase.initializeApp(firebaseConfig);

        // 4. دالة الدخول عند الضغط على الزر
        document.getElementById("loginBtn").addEventListener("click", function() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("خطأ: " + error.message);
                });
        });
    </script>
</body>
</html>
